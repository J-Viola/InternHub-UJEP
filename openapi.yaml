openapi: 3.0.3
info:
  title: InternHub UJEP API
  version: 1.0.0
  description: API pro správu studentských praxí na UJEP (InternHub). Umožňuje správu
    organizací, praxí a přihlášek studentů.
paths:
  /api/audit-logs/:
    get:
      operationId: audit_logs_list
      description: Global audit log API — admin only.
      tags:
      - audit-logs
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActionLog'
          description: ''
  /api/auth/check/:
    get:
      operationId: auth_check_retrieve
      description: |-
        Auth gate pro nginx ``auth_request`` na ``/storage/`` (A-01).

        Nginx předá původní URI v ``X-Original-URI``; stejná autorizační funkce jako
        ``ServeStorageFileView``. Chybějící hlavička, neznámý soubor, traversal i
        nedostatečné oprávnění → **403** (``auth_request`` rozumí jen 2xx/401/403,
        cokoli jiného by Nginx změnil na 500). Nepřihlášený → 401 (DRF).
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/code-lists/locations/:
    get:
      operationId: code_lists_locations_retrieve
      description: De-duplicated set of cities + addresses for the listing-page location
        filter.
      summary: Get unique practice locations
      tags:
      - Utils
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: List of unique locations
  /api/dashboard/stats/:
    get:
      operationId: dashboard_stats_retrieve
      description: Monitoring dashboard stats endpoint.
      tags:
      - dashboard
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/departments/admin-departments/:
    get:
      operationId: departments_admin_departments_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - departments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminDepartmentList'
          description: ''
    post:
      operationId: departments_admin_departments_create
      tags:
      - departments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminDepartmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminDepartmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminDepartmentRequest'
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDepartment'
          description: ''
  /api/departments/admin-departments/{department_id}/:
    get:
      operationId: departments_admin_departments_retrieve
      parameters:
      - in: path
        name: department_id
        schema:
          type: integer
        description: A unique integer value identifying this department.
        required: true
      tags:
      - departments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDepartment'
          description: ''
    put:
      operationId: departments_admin_departments_update
      parameters:
      - in: path
        name: department_id
        schema:
          type: integer
        description: A unique integer value identifying this department.
        required: true
      tags:
      - departments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminDepartmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminDepartmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminDepartmentRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDepartment'
          description: ''
    patch:
      operationId: departments_admin_departments_partial_update
      parameters:
      - in: path
        name: department_id
        schema:
          type: integer
        description: A unique integer value identifying this department.
        required: true
      tags:
      - departments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminDepartmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminDepartmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminDepartmentRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDepartment'
          description: ''
    delete:
      operationId: departments_admin_departments_destroy
      parameters:
      - in: path
        name: department_id
        schema:
          type: integer
        description: A unique integer value identifying this department.
        required: true
      tags:
      - departments
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/departments/department-professor/:
    get:
      operationId: departments_department_professor_list
      description: 'Returns a list of professors belonging to the same department
        as the logged-in user. **Permissions: Authenticated User**'
      summary: List professors in department
      tags:
      - Department
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProfessorDetail'
          description: ''
  /api/departments/department-professor/{user_id}/:
    get:
      operationId: departments_department_professor_retrieve
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        description: A unique integer value identifying this professor user.
        required: true
      tags:
      - departments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfessorUserProfile'
          description: ''
    put:
      operationId: departments_department_professor_update
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        description: A unique integer value identifying this professor user.
        required: true
      tags:
      - departments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfessorUserProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProfessorUserProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProfessorUserProfileRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfessorUserProfile'
          description: ''
    patch:
      operationId: departments_department_professor_partial_update
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        description: A unique integer value identifying this professor user.
        required: true
      tags:
      - departments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfessorUserProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProfessorUserProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProfessorUserProfileRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfessorUserProfile'
          description: ''
    delete:
      operationId: departments_department_professor_destroy
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        description: A unique integer value identifying this professor user.
        required: true
      tags:
      - departments
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/departments/department-professor/all/:
    get:
      operationId: departments_department_professor_all_list
      description: 'Returns a comprehensive list of all professors in the system.
        **Permissions: Authenticated User**'
      summary: List all professors across all departments
      tags:
      - Department
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProfessorDetail'
          description: ''
  /api/departments/department-students/:
    get:
      operationId: departments_department_students_list
      description: 'Returns a list of students belonging to the same department as
        the logged-in user. **Permissions: Authenticated User**'
      summary: List students in department
      tags:
      - Department
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudentDetail'
          description: ''
  /api/departments/department-users/:
    get:
      operationId: departments_department_users_list
      description: 'Returns a list of students belonging to the same department as
        the logged-in user. **Permissions: Authenticated User**'
      summary: List students in department
      tags:
      - Department
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudentDetail'
          description: ''
  /api/documents/{path}/:
    get:
      operationId: documents_retrieve
      description: Zpětně kompatibilní trasa ``/api/documents/<path>/`` (kořen ``documents/``).
      parameters:
      - in: path
        name: path
        schema:
          type: string
        required: true
      tags:
      - documents
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/export-data/:
    get:
      operationId: export_data_retrieve
      description: |-
        Bulk data export endpoint for practices.
        Pro >500 záznamů spouští asynchronní Celery task.
      tags:
      - export-data
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/export/download/{export_id}/:
    get:
      operationId: export_download_retrieve
      description: Endpoint pro stažení hotového asynchronního exportu.
      parameters:
      - in: path
        name: export_id
        schema:
          type: string
        required: true
      tags:
      - export
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/export/status/{export_id}/:
    get:
      operationId: export_status_retrieve
      description: |-
        Endpoint pro kontrolu stavu asynchronního exportu (polling).

        odpověď ``{"state": "PENDING|SUCCESS|FAILURE",
        "download_url": ...}`` — download_url je naplněna cestou
        ``/api/export/download/{export_id}/`` při SUCCESS, jinak ``null``.
      parameters:
      - in: path
        name: export_id
        schema:
          type: string
        required: true
      tags:
      - export
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/files/{path}/:
    get:
      operationId: files_retrieve
      description: |-
        Serve a file from ``STORAGE_ROOT`` with authentication and path validation.

        A-25: oprávnění rozhoduje jediná funkce ``api.file_access.check_storage_access``
        (stejná jako v ``StorageAuthCheckView`` a ``DocumentPermissionMiddleware``):
          - Superuser → always allowed
          - CV / profilová fotka: owner / employer who received application / professor
            teaching the student's subject / department head
          - Practice docs: delegated to ``UploadedDocument.user_has_permission()``
          - Firemní loga: veřejná

        Replace ``/storage/`` direct Nginx serve with ``X-Accel-Redirect`` in production
        to bypass Django for the actual byte stream.
      parameters:
      - in: path
        name: path
        schema:
          type: string
        required: true
      tags:
      - files
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/health/:
    get:
      operationId: health_retrieve
      description: |-
        K8s liveness/readiness probe.
        200 + ``{"db":"ok"}`` when DB reachable, 503 otherwise.
      tags:
      - health
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/notifications/:
    get:
      operationId: notifications_list
      tags:
      - notifications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
          description: ''
  /api/notifications/{id}/:
    get:
      operationId: notifications_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - notifications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
          description: ''
  /api/notifications/{id}/read/:
    patch:
      operationId: notifications_read_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - notifications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedNotificationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedNotificationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedNotificationRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
          description: ''
  /api/notifications/read_all/:
    post:
      operationId: notifications_read_all_create
      tags:
      - notifications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NotificationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NotificationRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
          description: ''
  /api/notifications/unread_count/:
    get:
      operationId: notifications_unread_count_retrieve
      tags:
      - notifications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
          description: ''
  /api/practices/{id}/cancel/:
    post:
      operationId: practices_cancel_create
      description: Stornuje nabídku praxe — deaktivuje ji a zaznamená důvod storna.
      summary: Cancel a practice
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Practices - Staff
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelPracticeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CancelPracticeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CancelPracticeRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Practice'
          description: ''
  /api/practices/{id}/close-applications/:
    post:
      operationId: practices_close_applications_create
      description: Uzavře sběr přihlášek na nabídku praxe (manuálně).
      summary: Close practice for applications
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Practices - Staff
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloseApplicationsRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CloseApplicationsRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CloseApplicationsRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Practice'
          description: ''
  /api/practices/{id}/transition/:
    post:
      operationId: practices_transition_create
      description: Provede přechod stavu nabídky praxe podle definovaného state machine.
      summary: Transition practice workflow state
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Practices - Staff
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionPracticeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TransitionPracticeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TransitionPracticeRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Practice'
          description: ''
  /api/practices/admin-practices/:
    get:
      operationId: practices_admin_practices_list
      summary: List all practices grouped by status (Admin)
      tags:
      - Practices - Admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrganizationPractice'
          description: ''
  /api/practices/employer/:
    get:
      operationId: practices_employer_list
      description: ViewSet for employers to manage their own practices.
      summary: List organization practices
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Practices - Employer
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrganizationPracticeList'
          description: ''
    post:
      operationId: practices_employer_create
      description: ViewSet for employers to manage their own practices.
      summary: Create a new practice
      tags:
      - Practices - Employer
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PracticeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PracticeRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/PracticeRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Practice'
          description: ''
  /api/practices/employer/{id}/:
    get:
      operationId: practices_employer_retrieve
      description: ViewSet for employers to manage their own practices.
      summary: Get organization practice detail
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - Practices - Employer
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationPractice'
          description: ''
    put:
      operationId: practices_employer_update
      description: ViewSet for employers to manage their own practices.
      summary: Update an organization practice
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - Practices - Employer
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PracticeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PracticeRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/PracticeRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Practice'
          description: ''
    patch:
      operationId: practices_employer_partial_update
      description: ViewSet for employers to manage their own practices.
      summary: Partially update an organization practice
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - Practices - Employer
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPracticeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPracticeRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPracticeRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Practice'
          description: ''
    delete:
      operationId: practices_employer_destroy
      description: ViewSet for employers to manage their own practices.
      summary: Delete an organization practice
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - Practices - Employer
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/practices/external/:
    post:
      operationId: practices_external_create
      description: Vytvoří mimosystémovou praxi — pro studenty nebo školy, kde firma
        není registrována v systému.
      summary: Create external practice
      tags:
      - Practices - External
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalPracticeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ExternalPracticeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExternalPracticeRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Practice'
          description: ''
  /api/practices/get-end-date/:
    post:
      operationId: practices_get_end_date_create
      summary: Calculate end date of practice
      tags:
      - Utils
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/practices/staff/{id}/approve/:
    post:
      operationId: practices_staff_approve_create
      description: |-
        ViewSet for teachers and department heads to manage and approve practices.
        Admins (OrganizationUser with is_superuser) can also approve practices.
      summary: Change approval status of a practice
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - Practices - Staff
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PracticeApprovalStatusRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PracticeApprovalStatusRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PracticeApprovalStatusRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PracticeApprovalStatus'
