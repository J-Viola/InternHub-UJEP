name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]

jobs:
  # ── Backend ─────────────────────────────────────────────────────────────────
  backend-lint:
    name: Backend lint (Ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Ruff
        run: pip install ruff

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

  backend-tests:
    name: Backend tests (Django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: internhub_test
          POSTGRES_USER: internhub
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U internhub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PG_DB: internhub_test
      PG_USER: internhub
      PG_PASSWORD: testpassword
      PG_HOST: localhost
      PG_PORT: 5432
      SECRET_KEY: ci-test-secret-key-not-used-in-production
      JWT_SECRET_KEY: ci-test-jwt-secret
      DEBUG: "True"
      STAG_MOCK: "True"
      EMAIL_USE_TLS: "False"
      DEMO_LOGIN: "False"
      MIGRATE_DEMO: "False"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create logs directory
        run: mkdir -p logs

      - name: Run migrations
        run: python manage.py migrate --settings=app.test_settings

      - name: Run tests
        run: pytest

      - name: Generate OpenAPI schema
        run: python manage.py spectacular --file schema.yaml
        working-directory: ./backend

      - name: Upload schema artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi-schema
          path: backend/schema.yaml

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend-tests:
    name: Frontend tests (Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watchAll=false

  frontend-build:
    name: Frontend build check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          REACT_APP_API_URL: http://localhost:8000
          CI: "true"

  # ── E2E (Playwright) ──────────────────────────────────────────────────────────
  e2e-tests:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: internhub_test
          POSTGRES_USER: internhub
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U internhub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PG_DB: internhub_test
      PG_USER: internhub
      PG_PASSWORD: testpassword
      PG_HOST: localhost
      PG_PORT: 5432
      SECRET_KEY: ci-e2e-secret-key-not-used-in-production
      JWT_SECRET_KEY: ci-e2e-jwt-secret
      DEBUG: "True"
      STAG_MOCK: "True"
      DEMO_LOGIN: "True"
      MIGRATE_DEMO: "True"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python deps
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Create logs directory
        run: mkdir -p logs
        working-directory: backend

      - name: Run migrations
        run: python manage.py migrate
        working-directory: backend

      - name: Seed demo data
        run: python manage.py seed_db
        working-directory: backend

      - name: Start Django backend
        run: |
          python manage.py runserver 0.0.0.0:8000 &
          for i in $(seq 1 15); do
            if curl -s http://localhost:8000/api/health/ >/dev/null 2>&1; then
              echo "Django ready"
              break
            fi
            echo "Waiting for Django... ($i)"
            sleep 2
          done
        working-directory: backend

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        env:
          REACT_APP_API_URL: http://localhost:8000
          CI: "true"
        working-directory: frontend

      - name: Install Playwright browsers
        run: npx playwright install chromium
        working-directory: frontend

      - name: Serve frontend build
        run: |
          npx serve -s build -l 3000 &
          for i in $(seq 1 10); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 | grep -q 200; then
              echo "Frontend ready"
              break
            fi
            echo "Waiting for frontend... ($i)"
            sleep 2
          done
        working-directory: frontend

      - name: Run E2E tests
        run: npx playwright test --reporter=list
        working-directory: frontend
