# A-22: hlavičku X-Forwarded-Proto od vnější (TLS) proxy nepřepisovat; bez ní použít $scheme.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# HSTS jen za HTTPS (vnější TLS proxy posílá X-Forwarded-Proto: https); prázdná hodnota hlavičku nevypíše.
map $fwd_proto $hsts_value {
    default "";
    https   "max-age=31536000";
}

# A-16: CSP pro React HTML a statiku. /api/ a /admin/ ji dostávají z Djanga (admin potřebuje inline skripty),
# proto tam nginx hlavičku nepřidává (prázdná hodnota = hlavička se nevypíše). Build běží s
# INLINE_RUNTIME_CHUNK=false, takže SPA nemá inline skripty; style-src 'unsafe-inline' je nutné pro React `style=`.
map $request_uri $csp_value {
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self'; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'";
    ~^/(api|admin)/ "";
}

server {
    listen 80;
    server_name localhost;
    # Limit těla požadavku s rezervou nad 20 MB souborem (multipart režie) — jinak 413 před validací.
    client_max_body_size 25M;

    # Bezpečnostní hlavičky i pro React HTML a statiku (u /api/ a /admin/ CSP posílá Django).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security $hsts_value always;
    add_header Content-Security-Policy $csp_value always;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Serve React App
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://django:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    location /admin/ {
        proxy_pass http://django:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    # Serve Django Static Files (Admin etc.)
    location /static/django/ {
        alias /usr/share/nginx/html/static/django/;
    }

    # A-24/A-01: loga firem jsou veřejná (součást nabídky) — <img> neposílá Authorization.
    # Regex-prefix location má přednost před obecným /storage/ s auth_request.
    location ^~ /storage/images/logos/ {
        alias /usr/share/nginx/html/storage/images/logos/;
    }
    location ^~ /storage/storage/images/logos/ {
        alias /usr/share/nginx/html/storage/storage/images/logos/;
    }

    # Serve Media/Storage Files — protected via auth subrequest
    # A-20: zamítnutí (403 z auth_request) se navenek tváří jako 404 — neprozrazuje existenci souboru. 401 zůstává.
    location /storage/ {
        auth_request /api/auth/check/;
        error_page 403 =404 @storage_not_found;
        alias /usr/share/nginx/html/storage/;
    }

    location @storage_not_found {
        return 404;
    }

    # Internal auth subrequest endpoint — proxy to Django for token verification
    location = /api/auth/check/ {
        internal;
        proxy_pass http://django:8000/api/auth/check/;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Authorization $http_authorization;
    }
}