services:
  postgres:
    image: postgres:17
    container_name: internhub-postgres
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${PG_DB}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $PG_USER -d $PG_DB"]
      interval: 10s
      timeout: 10s
      retries: 30
    networks:
      - internhub

  redis:
    image: redis:7-alpine
    container_name: internhub-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - internhub
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  django:
    build:
      context: .
      dockerfile: .docker/Backend/Dockerfile.prod
      args:
        - PY_VERSION=${PY_VERSION}
    container_name: internhub-backend
    restart: unless-stopped
    # command z image (gunicorn, počet workerů z GUNICORN_WORKERS — výchozí 3)
    env_file:
      - .env
    environment:
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
    volumes:
      - storage_data:/app/backend/storage
      - logs_data:/app/backend/logs
      - static_data:/app/backend/staticfiles
    expose:
      - "8000"
    healthcheck:
      # migrace + collectstatic běží v entrypointu před startem gunicornu; X-Forwarded-Proto kvůli SECURE_SSL_REDIRECT
      test: ["CMD", "python", "-c", "import os, urllib.request as u; h = (os.environ.get('ALLOWED_HOSTS', '').split(',')[0].strip().lstrip('.') or 'localhost'); h = 'localhost' if h == '*' else h; r = u.Request('http://127.0.0.1:8000/api/health/', headers={'X-Forwarded-Proto': 'https', 'Host': h}); u.urlopen(r, timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internhub

  celery-worker:
    build:
      context: .
      dockerfile: .docker/Backend/Dockerfile.prod
      args:
        - PY_VERSION=${PY_VERSION}
    container_name: internhub-celery-worker
    command: celery -A app worker --loglevel=info --concurrency=2
    env_file:
      - .env
    volumes:
      - storage_data:/app/backend/storage
      - logs_data:/app/backend/logs
    depends_on:
      django:
        condition: service_healthy  # schéma musí existovat (migrate běží v django entrypointu)
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internhub
    restart: unless-stopped

  # A-27: scheduler (supercronic) nahrazuje Celery Beat. Právě jedna instance — nikdy neškálovat
  # (replicas > 1 by spouštěly úlohy vícekrát).
  scheduler:
    build:
      context: .
      dockerfile: .docker/Backend/Dockerfile.prod
      args:
        - PY_VERSION=${PY_VERSION}
    container_name: internhub-scheduler
    command: supercronic /app/backend/crontab
    env_file:
      - .env
    environment:
      TZ: Europe/Prague
    volumes:
      - storage_data:/app/backend/storage
      - logs_data:/app/backend/logs
    depends_on:
      django:
        condition: service_healthy  # schéma musí existovat (migrate běží v django entrypointu)
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internhub
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: .docker/Frontend/Dockerfile.prod
      args:
        - NODE_VERSION=${NODE_VERSION}
    container_name: internhub-frontend
    restart: always
    ports:
      - "80:80"
    volumes:
      - storage_data:/usr/share/nginx/html/storage:ro
      - static_data:/usr/share/nginx/html/static/django:ro
    depends_on:
      django:
        condition: service_healthy
    networks:
      - internhub

networks:
  internhub:
    name: internhub
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  storage_data:
  logs_data:
  static_data:
